backend:
  name: turbo-github
  turbo_site_id: 8f035ee2-72d8-485a-91b2-b09abc831d51

media_folder: "assets/uploads"
public_folder: "/portfolio/assets/uploads"

collections:
  - name: "profile"
    label: "Profile"
    files:
      - name: "profile"
        label: "Profile and About"
        file: "_data/profile.yml"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
          - label: "Headline"
            name: "headline"
            widget: "object"
            fields:
              - label: "Before highlighted text"
                name: "before"
                widget: "string"
              - label: "Highlighted text"
                name: "highlight"
                widget: "string"
              - label: "After highlighted text"
                name: "after"
                widget: "string"
          - label: "Summary"
            name: "summary"
            widget: "text"
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "object"
                fields:
                  - label: "Before highlighted text"
                    name: "before"
                    widget: "string"
                  - label: "Highlighted text"
                    name: "highlight"
                    widget: "string"
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field:
                  label: "Paragraph"
                  name: "paragraph"
                  widget: "text"
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - label: "Value"
                    name: "value"
                    widget: "string"
                  - label: "Label"
                    name: "label"
                    widget: "string"
              - label: "Note"
                name: "note"
                widget: "text"
  - name: "skills"
    label: "Skills"
    files:
      - name: "skills"
        label: "Technical Skills"
        file: "_data/skills.yml"
        fields:
          - label: "Section Label"
            name: "eyebrow"
            widget: "string"
          - label: "Heading"
            name: "heading"
            widget: "object"
            fields:
              - label: "Before highlighted text"
                name: "before"
                widget: "string"
              - label: "Highlighted text"
                name: "highlight"
                widget: "string"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Categories"
            name: "categories"
            widget: "list"
            allow_add: true
            allow_remove: true
            allow_reorder: true
            summary: "{{fields.name}}"
            fields:
              - label: "Category Name"
                name: "name"
                widget: "string"
              - label: "Icon"
                name: "icon"
                widget: "string"
              - label: "Skills"
                name: "skills"
                widget: "list"
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field:
                  label: "Skill"
                  name: "skill"
                  widget: "string"
  - name: "experience"
    label: "Experience"
    files:
      - name: "experience"
        label: "Professional Experience"
        file: "_data/experience.yml"
        fields:
          - label: "Section Label"
            name: "eyebrow"
            widget: "string"
          - label: "Heading"
            name: "heading"
            widget: "object"
            fields:
              - label: "Before highlighted text"
                name: "before"
                widget: "string"
              - label: "Highlighted text"
                name: "highlight"
                widget: "string"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Entries"
            name: "entries"
            widget: "list"
            required: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            summary: "{{fields.title}}"
            fields:
              - label: "Entry Label"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Entry Heading"
                name: "title"
                widget: "string"
              - label: "Job Title"
                name: "job_title"
                widget: "string"
                required: false
              - label: "Company"
                name: "company"
                widget: "string"
                required: false
              - label: "Employment Dates"
                name: "employment_dates"
                widget: "string"
                required: false
              - label: "Location"
                name: "location"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Responsibilities and Achievements"
                name: "responsibilities"
                widget: "list"
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field:
                  label: "Responsibility or Achievement"
                  name: "responsibility"
                  widget: "text"
              - label: "Technologies"
                name: "technologies"
                widget: "list"
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field:
                  label: "Technology"
                  name: "technology"
                  widget: "string"
  - name: "projects"
    label: "Projects"
    files:
      - name: "projects"
        label: "Projects"
        file: "_data/projects.yml"
        fields:
          - label: "Section Label"
            name: "eyebrow"
            widget: "string"
          - label: "Heading"
            name: "heading"
            widget: "object"
            fields:
              - label: "Before highlighted text"
                name: "before"
                widget: "string"
              - label: "Highlighted text"
                name: "highlight"
                widget: "string"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Projects"
            name: "projects"
            widget: "list"
            allow_add: true
            allow_remove: true
            allow_reorder: true
            summary: "{{fields.name}}"
            fields:
              - label: "Project Name"
                name: "name"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Technologies"
                name: "technologies"
                widget: "list"
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field:
                  label: "Technology"
                  name: "technology"
                  widget: "string"
              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field:
                  label: "Tag"
                  name: "tag"
                  widget: "string"
              - label: "Project Image"
                name: "image"
                widget: "image"
                required: false
              - label: "GitHub Repository URL"
                name: "github_url"
                widget: "string"
                required: false
              - label: "Live Demo URL"
                name: "live_demo_url"
                widget: "string"
                required: false
              - label: "Project Status"
                name: "status"
                widget: "select"
                required: false
                options:
                  - label: "Planned"
                    value: "Planned"
                  - label: "In Progress"
                    value: "In Progress"
                  - label: "Completed"
                    value: "Completed"
              - label: "Architecture Details"
                name: "architecture"
                widget: "object"
                required: false
                fields:
                  - label: "Section Label"
                    name: "eyebrow"
                    widget: "string"
                    required: false
                  - label: "Details Anchor"
                    name: "anchor"
                    widget: "string"
                    required: false
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                    required: false
                  - label: "Delivery Steps"
                    name: "steps"
                    widget: "list"
                    required: false
                    allow_add: true
                    allow_remove: true
                    allow_reorder: true
                    summary: "{{fields.title}}"
                    fields:
                      - label: "Step Name"
                        name: "title"
                        widget: "string"
                      - label: "Description"
                        name: "description"
                        widget: "text"
                  - label: "Note"
                    name: "note"
                    widget: "text"
                    required: false
